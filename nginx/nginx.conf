events {}

http {
    # IP allowlist — Grafana and Prometheus are restricted to office/VPN IPs
    geo $allowed_ip {
        default          0;
        49.248.97.58     1;
        103.56.43.229    1;
        150.107.183.71   1;
        103.56.42.245    1;
        14.96.214.66     1;
    }

    # Grafana — port 80
    server {
        listen 80;
        server_name _;

        location / {
            if ($allowed_ip = 0) {
                return 403;
            }
            proxy_pass             http://grafana:3000;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_read_timeout     300s;
            proxy_send_timeout     300s;
        }
    }

    # Prometheus — port 9090
    server {
        listen 9090;
        server_name _;

        location / {
            if ($allowed_ip = 0) {
                return 403;
            }
            proxy_pass         http://prometheus:9090;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }

    # Loki — port 3100
    server {
        listen 3100;
        server_name _;

        location / {
            if ($allowed_ip = 0) {
                return 403;
            }
            proxy_pass         http://loki:3100;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
