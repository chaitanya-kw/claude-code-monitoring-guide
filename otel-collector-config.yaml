receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  transform/promote_project:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["project"], resource.attributes["project"]) where resource.attributes["project"] != nil
          - set(attributes["project"], "unknown") where resource.attributes["project"] == nil
  transform/loki_labels:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          # These become indexed Loki stream labels (low cardinality — keep this list short)
          - set(attributes["loki.attribute.labels"], "event.name,user.email,project,os.type,service.version")
      - context: resource
        statements:
          - set(attributes["loki.resource.labels"], "service.name")

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    send_timestamps: true
    metric_expiration: 180m
    enable_open_metrics: true

  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    default_labels_enabled:
      exporter: false
      job: false
      level: true
      service_name: true

  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 200

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, transform/promote_project, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/loki_labels, batch]
      exporters: [loki, debug]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
      
  extensions: []
  
  telemetry:
    logs:
      level: "debug"